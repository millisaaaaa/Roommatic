<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <title>ROOMMATIC Prototype (HTML)</title>
  <style>
    
	.hero-btn{
	  /* Hero 專用按鈕放大 */
	  padding: 12px 54px;
	  font-size: 18px;
	  font-weight: 600;
	}

	.pain-cta{
	  display:inline-flex;
	  align-items:center;
	  justify-content:center;
	  margin-top:20px;
	  padding:12px 28px;
	  border-radius:999px;
	  background:#2f5f9f;
	  color:#fff;
	  text-decoration:none;
	  font-weight:600;
	  box-shadow:0 10px 24px rgba(47,95,159,0.18);
	  transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
	}
	.pain-cta:hover{
	  transform:translateY(-2px);
	  background:#244d84;
	  box-shadow:0 14px 28px rgba(47,95,159,0.22);
	}

    /* ====== Layout wrappers ====== */
    .container{
      max-width:1100px;
      margin:0 auto;
      padding:18px;
    }

    /* ====== Public Landing ====== */
	.hero{
	  /* 設定背景漸層 */
	  background: linear-gradient(to right, #c5daf7 0%, #f3f4f1 48%, #f8f3d2 100%);

	  /* 加外框線 */


	  /* 四角變圓 */
	  border-radius: 28px;

	  /* 加陰影 */
	  box-shadow: var(--shadow);

	  /* 內距：上下 56、左右 32 */
	  padding: 30px 32px;

	  /* 超出範圍先隱藏 */
	  overflow: hidden;

	  /* 方便之後放裝飾元素或定位 */
	  position: relative;

	  /* 最小高度 */
	  height: 700px;

	  /* 文字整體置中 */
	  text-align: center;
	}
	.hero-inner{
	  /* Hero 內容最大寬度 */
	  max-width: 1000px;
	  margin: 0 auto;
	  width: 100%;	  
	}
	.hero-main{
	  /* 直向排列 */
	  display: flex;
	  flex-direction: column;

	  /* 每個元素間距 */
	  gap: 18px;

	  /* 裡面元素水平置中 */
	  align-items: center;

	  /* 文字置中 */
	  text-align: center;

	  /* 撐滿寬度 */
	  width: 100%;
	}
	.hero::after {
	  content: "";
	  position: absolute;
	  left: 0;
	  bottom: -1px;
	  width: 100%;
	  height: 120px;
	  background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(243,244,246,0.9) 70%, rgba(243,244,246,1) 100%);
	  pointer-events: none;
	  z-index: 2;
	}
   .hero p{
	  /* 清掉預設外距 */
	  margin: 0;

	  /* 淡色文字 */
	  color: var(--muted);

	  /* 行距 */
	  line-height: 1.8;

	  /* 限制文字寬度 */
	  max-width: 62ch;

	  /* 字體大小 */
	  font-size: 20px;
	}
    .hero-actions{
	  position: relative;
	  z-index: 3;
	  /* 按鈕橫向排列 */
	  display: flex;

	  /* 按鈕間距 */
	  gap: 12px;

	  /* 空間不夠可換行 */
	  flex-wrap: wrap;
	  justify-content: space-between;
      align-items: center;

	  /* 撐滿寬度，置中才會有作用 */
	  width: 100%;
	  max-width: 1100px;
	 
	  /* 上方往主視覺區靠近 */
	  margin: -300px auto 0;
	  padding: 0 70px;
	}
	.hero-visual{
	  position: relative;
	  z-index: 2;
	  
	  /* 主視覺區置中 */
	  display: flex;
	  justify-content: center;
	  align-items: center;
	  

	  /* 和下方文字拉開 */
	  margin-bottom: 16px;
	}

	.hero-visual-image{
	  /* 主視覺圖片大小 */
	  width: 1150px;

	  /* 響應式：不要超出容器 */
	  max-width: none;

	  /* 避免圖片底部多空隙 */
	  display: block;
	}
	.hero-slogan{
	  /* 放在圖片下面、按鈕上面 */
	  position: relative;
	  z-index: 3;
	  bottom: 10px;

	  /* 字體大小 */
	  font-size: 18px;

	  /* 字重 */
	  font-weight: 600;

	  /* 文字顏色 */
	  color: #222;

	  /* 和上面圖片距離 */
	  margin-top: 0px;

	  /* 和下面按鈕距離 */
	  margin-bottom: 0px;

	  /* 文字置中 */
	  text-align: center;
	}
	.hero-curve{
	  /* 白色弧形底 */
	  position: absolute;
	  left: 50%;
	  bottom: -960px;
	  transform: translateX(-50%);

	  /* 大小你可以再調 */
	  width: 1700px;
	  height: 1360px;

	  /* 白色 */
	  background: #ffffff;

	  /* 做成大半圓 */
	  border-radius: 50%;

	  /* 放在主視覺後面 */
	  z-index: 1;
	}
    .chips{ margin-top:18px; display:flex; gap:8px; flex-wrap:wrap; }
    .chip{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(127,147,173,.25);
      background:rgba(255,255,255,.6);
      color:var(--brandDeep);
      font-size:13px;
    }
	.pain-section {
	  background: linear-gradient(to bottom, #eef2f7 0%, #f3f4f6 18%, #f3f4f6 100%);
	  position: relative;
	  min-height: 760px;
	  overflow: hidden;
	  padding: 100px 20px;
	  text-align: center;
	}

	.pain-title {
	  font-size: 2rem;
	  font-weight: 700;
	  color: #222;
	  margin-bottom: 50px;
	}

	.pain-list {
	  max-width: 1100px;
	  margin: 0 auto 50px;
	  display: flex;
	  flex-direction: column;
	  gap: 28px;
	  align-items: center;
	}

	.pain-center {
	  display: flex;
	  justify-content: center;
	  margin-bottom: 30px;
	}

	.pain-room-img {
	  width: 500px;
	  opacity: 0.55;
	}
	
	.pain-box {
	  position: absolute;
	  z-index: 2;
	  overflow: visible;
	  background: rgba(255, 255, 255, 0.08);
	  border: 1.2px solid rgba(34, 34, 34, 0.55);
	  border-radius: 18px;
	  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
	  backdrop-filter: blur(4px);
	  -webkit-backdrop-filter: blur(4px);
	  padding: 16px 22px;
	  font-size: 18px;
	  font-weight: 600;
	  max-width: 450px;
	  line-height: 1.5;
	  text-align: center;
	}
	
	.pain-box::before {
	  content: "";
	  position: absolute;
	  z-index: 0;
	  pointer-events: none;
	  opacity: 0.75;
	  filter: blur(1px);
	}

	.pain-box-1::before {
	  width: 300px;
	  height: 26px;
	  left: -285px;
	  top: 50%;
	  transform: translateY(-50%) rotate(-18deg);
	  transform-origin: right center;
	  background: linear-gradient(
		  to right,
		  rgba(255, 236, 170, 0) 0%,
		  rgba(255, 236, 170, 0.16) 18%,
		  rgba(255, 236, 170, 0.30) 50%,
		  rgba(255, 236, 170, 0.18) 72%,
		  rgba(255, 236, 170, 0) 90%
		);
	  clip-path: polygon(0 48%, 0 52%, 100% 0, 100% 100%);
	}

	.pain-box-2::before {
	  width: 300px;
	  height: 26px;
	  right: -285px;
	  top: 50%;
	  transform: translateY(-50%) rotate(12deg);
	  transform-origin: left center;
	 background: linear-gradient(
		  to left,
		  rgba(255, 236, 170, 0) 0%,
		  rgba(255, 236, 170, 0.16) 18%,
		  rgba(255, 236, 170, 0.30) 50%,
		  rgba(255, 236, 170, 0.18) 72%,
		  rgba(255, 236, 170, 0) 90%
		);
	  clip-path: polygon(0 0, 0 100%, 100% 52%, 100% 48%);
	}

	.pain-box-3::before {
	  width: 300px;
	  height: 26px;
	  left: -285px;
	  top: 50%;
	  transform: translateY(-50%) rotate(18deg);
	  transform-origin: right center;
	  background: linear-gradient(
		  to right,
		  rgba(255, 236, 170, 0) 0%,
		  rgba(255, 236, 170, 0.16) 18%,
		  rgba(255, 236, 170, 0.30) 50%,
		  rgba(255, 236, 170, 0.18) 72%,
		  rgba(255, 236, 170, 0) 90%
		);
	  clip-path: polygon(0 48%, 0 52%, 100% 0, 100% 100%);
	}
	
	.pain-box:hover::before {
	  opacity: 0.75;
	}
	
	.pain-box:hover {
	  transform: translateY(-4px);
	  box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.45);
	}

	.pain-box-1 {
	  top: 260px;
	  right: 280px;
	}

	.pain-box-2 {
	  top: 390px;
	  left: 300px;
	}

	.pain-box-3 {
	  top: 500px;
	  right: 250px;
	}

	.pain-summary {
	  font-size: 1.5rem;
	  color: #333;
	  margin: -30px auto 28px;
	  max-width: 900px;
	  line-height: 1.8;
	}

	.pain-btn {
	  display: inline-block;
	  padding: 14px 34px;
	  border-radius: 999px;
	  background: #555;
	  color: white;
	  text-decoration: none;
	  font-weight: 600;
	  transition: 0.3s ease;
	}

	.pain-btn:hover {
	  background: #333;
	}
	.pain-box {
	  opacity: 0;
	  transform: translateY(30px);
	  animation: fadeUp 0.8s ease forwards;
	}

	.pain-box-1 {
	  animation-delay: 0.2s;
	}

	.pain-box-2 {
	  animation-delay: 0.5s;
	}

	.pain-box-3 {
	  animation-delay: 0.8s;
	}

	@keyframes fadeUp {
	  to {
		opacity: 1;
		transform: translateY(0);
	  }
	}

    .section{
      margin-top:18px;
      background: var(--panel);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow: var(--shadow);
      padding:22px;
    }
    .section-title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
    }
    .section-title h2{
      margin:0;
      font-size:22px;
      letter-spacing:2px;
    }
    .section-title small{ color:var(--muted); }

    .cards{
      margin-top:14px;
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:12px;
    }
    @media (max-width: 860px){
	  .cards{ grid-template-columns:1fr; }
	  .hero{
		padding:28px 22px;
		min-height:auto;
	  }
	  .hero h1{
		font-size:48px;
	  }
	  .hero p{
		font-size:16px;
	  }
	}
    .card{
      border:1px solid var(--line);
      border-radius:22px;
      padding:14px;
      background: linear-gradient(180deg, rgba(127,147,173,.10), rgba(255,255,255,.9));
    }
    .card strong{ display:block; margin-bottom:6px; }
    .card p{ margin:0; color:var(--muted); line-height:1.6; font-size:14px; }
	
	.no-card-version {
	  padding: 90px 8% 110px; /* 區塊留白 */
	  background: transparent; /* 不另外加底色 */
	  text-align: center; /* 文字置中 */
	}

	.no-card-container {
	  display: flex; /* 橫向排列 */
	  justify-content: center; /* 置中 */
	  gap: 44px; /* 三欄距離 */
	  flex-wrap: wrap; /* 小螢幕可換行 */
	}

	.feature-item {
	  width: 360px; /* 拉寬一點，讓文字更不容易斷行 */
	  display: flex;
	  flex-direction: column;
	  align-items: center;
	}

	/* =========================
	   圖片和文字距離
	========================= */
	.feature-item .feature-image {
	  width: 100%;
	  max-width: 340px; /* 圖片可以再稍微大一點 */
	  height: 220px;
	  object-fit: cover;
	  border-radius: 28px;
	  display: block;
	  margin-bottom: 18px; /* 原本 26px 可縮小，讓圖文更靠近 */
	  opacity: 0.95;
	  filter: saturate(0.88) brightness(1.02);
	  box-shadow: 0 10px 24px rgba(120, 130, 150, 0.06);
	  transition: transform 0.35s ease, opacity 0.35s ease;
	}

	.feature-item h3 {
	  font-size: 1.5rem; /* 標題大小 */
	  color: #2E4A7D;
	  margin-bottom: 10px; /* 與內文距離 */
	  letter-spacing: 0.03em; /* 微字距 */
	}

	.feature-item p {
	  font-size: 0.98rem; /* 內文字大小 */
	  line-height: 1.8; /* 行高 */
	  color: #6f7682;
	  margin: 0 auto; /* 置中 */
	  max-width: 320px;
	}
		
		/* =========================
	   三大亮點整個區塊
	   改成和前面同一個世界觀：淡、輕、安靜
	========================= */
	.features-section {
	  padding: 90px 8% 110px; /* 上下留白，讓區塊呼吸感更好 */
	  background: transparent; /* 不另外做一塊底色，直接融進整頁背景 */
	  text-align: center; /* 文字置中 */
	  position: relative; /* 方便之後加裝飾 */
	}

	/* 如果你想讓這區更有一點淡淡氣氛，可以保留這個偽元素 */
	.features-section::before {
	  content: ""; /* 偽元素必備 */
	  position: absolute; /* 絕對定位 */
	  top: 120px; /* 往下放一點 */
	  left: 50%; /* 置中基準 */
	  transform: translateX(-50%); /* 真正水平置中 */
	  width: 520px; /* 光暈寬度 */
	  height: 520px; /* 光暈高度 */
	  background: radial-gradient(
		circle,
		rgba(255, 232, 170, 0.16) 0%,
		rgba(255, 232, 170, 0.08) 35%,
		rgba(255, 232, 170, 0) 70%
	  ); /* 很淡的暖黃色光暈，呼應你前面那區的光線 */
	  pointer-events: none; /* 不影響滑鼠操作 */
	  z-index: 0; /* 放在底層 */
	}

	/* =========================
	   上方標題區
	========================= */
	.features-header {
	  margin-bottom: 52px; /* 和卡片區的距離 */
	  position: relative; /* 蓋在光暈上方 */
	  z-index: 1;
	}

	.features-header h2 {
	  font-size: 3rem; /* 標題大小 */
	  font-weight: 700; /* 字重 */
	  color: #2f3a4a;
	  letter-spacing: 0.06em; /* 微微拉開字距，比較有品牌感 */
	  margin-bottom: 14px; /* 和副標距離 */
	}

	.features-header p {
	  font-size: 1rem; /* 副標大小 */
	  color: #7a8191; /* 柔和灰色 */
	  margin: 0; /* 清掉預設邊距 */
	  letter-spacing: 0.03em; /* 微微拉開字距 */
	}

	/* =========================
	   圖片
	========================= */
	.feature-image {
	  width: 100%; /* 滿版 */
	  height: 215px; /* 固定高度 */
	  object-fit: cover; /* 不變形填滿 */
	  border-radius: 22px; /* 圖片圓角 */
	  margin-bottom: 24px; /* 圖和標題距離 */
	  display: block; /* 避免圖片下方多空隙 */
	  filter: saturate(0.88) brightness(1.02); /* 稍微降彩度，和前面風格更一致 */
	}

	/* =========================
	   平板版
	========================= */
	@media (max-width: 992px) {
	  .features-header h2 {
		font-size: 2.5rem; /* 標題縮小 */
	  }

	  .feature-card {
		width: 290px; /* 卡片縮小 */
	  }

	  .feature-image {
		height: 200px; /* 圖片高度微調 */
	  }
	}

	/* =========================
	   手機版
	========================= */
	@media (max-width: 768px) {
	  .features-section {
		padding: 72px 6% 88px; /* 手機版留白縮小 */
	  }

	  .features-section::before {
		width: 320px; /* 光暈縮小 */
		height: 320px;
		top: 110px;
	  }

	  .features-header {
		margin-bottom: 38px; /* 標題和卡片區距離縮小 */
	  }

	  .features-header h2 {
		font-size: 2.1rem; /* 手機標題 */
	  }

	  .features-header p {
		font-size: 0.95rem; /* 手機副標 */
		line-height: 1.7;
	  }

	  .features-container {
		gap: 20px; /* 卡片間距縮小 */
	  }

	  .feature-card,
	  .feature-card:nth-child(2) {
		width: 100%; /* 一張一張排 */
		max-width: 380px; /* 不要太寬 */
		transform: none; /* 手機版不要高低差 */
	  }

	  .feature-card:hover,
	  .feature-card:nth-child(2):hover {
		transform: translateY(-4px); /* 手機版hover簡單一點 */
	  }

	  .feature-card h3 {
		font-size: 1.5rem; /* 標題縮小 */
	  }

	  .feature-card p {
		font-size: 0.95rem; /* 內文縮小 */
	  }

	  .feature-image {
		height: 210px; /* 手機圖片高度 */
	  }
	}
	
	/* =========================
	   使用流程整個區塊
	========================= */
	.process-section {
	  padding: 110px 8% 120px; /* 上下左右留白 */
	  background: transparent; /* 不另外加底色 */
	  text-align: center; /* 文字預設置中 */
	}

	/* =========================
	   標題區
	========================= */
	.process-header {
	  margin-bottom: 22px; /* 和分隔線距離 */
	}

	.process-header h2 {
	  font-size: 3rem; /* 中文主標大小 */
	  font-weight: 700; /* 字重 */
	  color: #2F3640; /* 黑灰色 */
	  margin-bottom: 10px; /* 和英文副標距離 */
	  letter-spacing: 0.08em; /* 微字距 */
	}

	.process-header p {
	  font-size: 1rem; /* 英文副標大小 */
	  color: #7D8491; /* 灰色 */
	  margin: 0; /* 清掉預設邊距 */
	  letter-spacing: 0.03em; /* 微字距 */
	}

	/* =========================
	   分隔線
	========================= */
	.process-divider {
	  width: 78%; /* 分隔線長度 */
	  height: 1px; /* 線的厚度 */
	  background-color: rgba(60, 70, 85, 0.35); /* 淡灰線 */
	  margin: 0 auto 56px auto; /* 置中，並和下方流程距離 */
	}

	/* =========================
	   流程外層
	========================= */
	.process-flow {
	  display: flex; /* 橫向排列 */
	  justify-content: center; /* 置中 */
	  align-items: flex-start; /* 頂端對齊 */
	  gap: 90px; /* 每個步驟之間距離 */
	  flex-wrap: wrap; /* 小螢幕時可換行 */
	}

	/* =========================
	   單一步驟
	========================= */
	.process-step {
	  width: 180px; /* 每一步寬度 */
	  display: flex; /* 垂直排列 */
	  flex-direction: column;
	  align-items: center; /* 水平置中 */
	}

	/* Step 小字 */
	.step-label {
	  font-size: 0.92rem; /* 小字大小 */
	  color: #7F8794; /* 灰藍色 */
	  letter-spacing: 0.04em; /* 微字距 */
	  margin-bottom: 16px; /* 和圓形距離 */
	}

	/* =========================
	   圓形步驟
	========================= */
	.step-circle {
	  width: 118px; /* 圓形寬度 */
	  height: 118px; /* 圓形高度 */
	  border-radius: 50%; /* 變成圓 */
	  display: flex; /* 方便置中 icon */
	  align-items: center;
	  justify-content: center;
	  margin-bottom: 18px; /* 和標題距離 */

	  /* 淡藍＋淡米白漸層，呼應你前面的風格 */
	  background: linear-gradient(
		135deg,
		rgba(210, 223, 245, 0.95) 0%,
		rgba(245, 240, 220, 0.92) 100%
	  );

	  border: 1px solid rgba(90, 100, 120, 0.45); /* 淡邊框 */
	  box-shadow: 0 8px 18px rgba(120, 130, 150, 0.06); /* 很淡陰影 */
	  transition: transform 0.3s ease, box-shadow 0.3s ease; /* hover 動畫 */
	}

	/* 滑鼠移上去時微微浮起 */
	.step-circle:hover {
	  transform: translateY(-4px); /* 往上浮 */
	  box-shadow: 0 12px 24px rgba(120, 130, 150, 0.10); /* 陰影稍微明顯 */
	}

	/* 圓裡面的示意 icon */
	.step-icon {
	  width: 58px;
	  height: 58px;
	  object-fit: contain;
	  display: block;
	}

	/* =========================
	   步驟標題
	========================= */
	.process-step h3 {
	  font-size: 1.35rem; /* 標題大小 */
	  font-weight: 700; /* 字重 */

/* =========================
   1) Simple Auth (localStorage)
========================= */
const LS_KEY = "roommatic_auth";
function isAuthed(){
  return localStorage.getItem(LS_KEY) === "1";
}
function login(){
  localStorage.setItem(LS_KEY, "1");
  localStorage.setItem("roommatic_name", document.querySelector("#authName")?.value || MOCK.user.name);
  localStorage.setItem("roommatic_email", document.querySelector("#authEmail")?.value || MOCK.user.email);
  go("#/app/dashboard");
}
function logout(){
  localStorage.removeItem(LS_KEY);
  render();
}

/* =========================
   2) Router (hash-based)
========================= */
function currentHash(){
  return location.hash || "#/";
}
function go(hash){
  location.hash = hash;
}
window.addEventListener("hashchange", render);

/* =========================
   3) Render: Public vs App
========================= */
function render(){
  const hash = currentHash();
  const authed = isAuthed();

  // Toggle roots
  const appRoot = document.getElementById("appRoot");
  const publicRoot = document.getElementById("publicRoot");
  const topbar = document.getElementById("publicTopbar");

  const inAppRoute = hash.startsWith("#/app");
  if (authed && inAppRoute){
    appRoot.classList.remove("hide");
    publicRoot.classList.add("hide");
    topbar.classList.add("hide");
    renderApp(hash);
  } else {
    // If trying to access app without auth -> redirect to login
    if (inAppRoute && !authed){
      go("#/auth/login");
      return;
    }
    appRoot.classList.add("hide");
    publicRoot.classList.remove("hide");
    topbar.classList.remove("hide");
    renderPublic(hash, authed);
  }
}
render();

/* =========================
   4) Public Pages
========================= */
function renderPublic(hash, authed){
  const root = document.getElementById("publicRoot");

  // If authed user hits public login -> allow but show "Go to App"
  if (hash === "#/" || hash === "#"){
    root.innerHTML = publicHome(authed);
    return;
  }
  if (hash.startsWith("#/auth")){
    root.innerHTML = publicAuth(hash);
    return;
  }
  if (hash === "#/faq"){
    root.innerHTML = publicFAQ();
    return;
  }
  if (hash === "#/plans"){
    root.innerHTML = publicPlans();
    return;
  }
  if (hash === "#/contact"){
    // mailto - 你可以改收件人
    window.location.href = `mailto:${getEmail()}?subject=ROOMMATIC%20Contact`;
    root.innerHTML = publicHome(authed);
    return;
  }

  // fallback
  root.innerHTML = publicHome(authed);
}

        <button class="btn" onclick="go('#/')">回介紹頁</button>
        <button class="btn primary" onclick="go('#/app/rooms')">查看 Rooms →</button>
      </div>
    </div>

    <div class="panel">
      <div class="kpis">
        <div class="kpi">
          <div class="label">今日總耗能（kWh）</div>
          <div class="value">${totalEnergy}</div>
        </div>
        <div class="kpi">
          <div class="label">目前有人房間數</div>
          <div class="value">${occupiedCount} / ${rooms.length}</div>
        </div>
        <div class="kpi">
          <div class="label">平均溫度（°C）</div>
          <div class="value">${avgTemp}</div>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top:12px;">
      <h3>接下來會放什麼？（示意）</h3>
      <div class="placeholder">
        這裡可以放：今日節能率、異常提醒（溫度過高/人流異常）、節能趨勢小圖。<br/>
        目前先用 placeholder 讓版面與路由穩定。
      </div>
    </div>
  `;
}

function appRooms(){
  return `
    <div class="page-head">
      <div>
        <h1>Rooms 房間管理</h1>
        <p>點任一房間可進入詳情頁（Room Detail）。</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn primary" onclick="alert('Prototype：新增房間功能之後再做')">＋ 新增房間</button>
      </div>
    </div>

    <div class="panel">
      <h3>房間列表</h3>
      <div class="rooms">
        ${MOCK.rooms.map(r=> roomCard(r)).join("")}
      </div>
    </div>
  `;
}

function roomCard(r){
  const pillClass = r.occupied ? "pill on" : "pill off";
  const pillText = r.occupied ? "有人使用中" : "目前無人";
  return `
    <div class="room-card" onclick="go('#/app/rooms/${encodeURIComponent(r.id)}')">
      <div class="room-top">
        <div class="room-name">${escapeHtml(r.name)}</div>
        <span class="${pillClass}">${pillText}</span>
      </div>
      <div class="room-meta">
        <div>溫度：<b>${r.temp.toFixed(1)}°C</b></div>
        <div>今日耗能：<b>${r.energyToday.toFixed(1)} kWh</b></div>
        <div>人數估計：<b>${r.people}</b></div>
        <div>房間 ID：<b>${escapeHtml(r.id)}</b></div>
      </div>
    </div>
  `;
}

function appRoomDetail(id){
  const r = MOCK.rooms.find(x=> x.id === id) || MOCK.rooms[0];
  const pillText = r.occupied ? "有人使用中" : "目前無人";
  return `
    <div class="page-head">
      <div>
        <h1>${escapeHtml(r.name)}｜Room Detail</h1>
        <p>房間細節：即時資訊＋（之後接）監看畫面與 AI 分析圖表。</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn" onclick="go('#/app/rooms')">← 回 Rooms</button>
        <button class="btn primary" onclick="alert('Prototype：控制/設定功能之後接')">設定偏好</button>
      </div>
    </div>

    <div class="panel">
      <div class="kpis">
        <div class="kpi">
          <div class="label">狀態</div>
          <div class="value">${pillText}</div>
        </div>
        <div class="kpi">
          <div class="label">溫度（°C）</div>
          <div class="value">${r.temp.toFixed(1)}</div>
        </div>
        <div class="kpi">
          <div class="label">今日耗能（kWh）</div>
          <div class="value">${r.energyToday.toFixed(1)}</div>
        </div>
      </div>
    </div>

    <div class="grid" style="margin-top:12px;">
      <div class="panel" style="grid-column: span 6;">
        <h3>即時畫面（Coming soon）</h3>
        <div class="placeholder">未來接：攝影機畫面 / 人流偵測疊圖</div>
      </div>
      <div class="panel" style="grid-column: span 6;">
        <h3>AI 分析（Coming soon）</h3>
        <div class="placeholder">未來接：人流趨勢、尖峰時段、節能建議</div>
      </div>
    </div>
  `;
}

function appBilling(){
  const plan = localStorage.getItem("roommatic_plan") || MOCK.user.plan;
  return `
    <div class="page-head">
      <div>
        <h1>Billing 方案與訂閱</h1>
        <p>這裡顯示「目前方案狀態」＋「升級入口」（示意）。</p>
      </div>
    </div>

    <div class="panel">
      <h3>目前方案</h3>
      <div class="kpis">
        <div class="kpi">
          <div class="label">Plan</div>
          <div class="value">${escapeHtml(plan)}</div>
        </div>
        <div class="kpi">
          <div class="label">可管理房間數（示意）</div>
          <div class="value">${plan === "Basic" ? "10" : plan === "Pro" ? "50" : "Unlimited"}</div>
        </div>
        <div class="kpi">
          <div class="label">下一步</div>
          <div class="value">升級 / 變更</div>
        </div>
      </div>

      <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn primary" onclick="setPlan('Pro')">升級到 Pro</button>
        <button class="btn" onclick="setPlan('Basic')">切回 Basic</button>
        <button class="btn" onclick="go('#/plans')">看公開方案頁</button>
      </div>
    </div>
  `;
}

/* =========================
   6) Helpers
========================= */
function scrollToId(id){
  // allow from any route
  if (currentHash() !== "#/"){
    go("#/");
    setTimeout(()=> scrollToId(id), 120);
    return;
  }
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
}

function scrollHeroDown(){
  window.scrollBy({
    top: 800,
    behavior: "smooth"
  });
}

function openAccount(){
  alert("Prototype：Account 可以先做成一個小彈窗或小頁面（Profile/Settings/Logout）。\n明天 meeting 先有 Sidebar + Rooms 流程就夠了。");
}

function setPlan(p){
  localStorage.setItem("roommatic_plan", p);
  render();
}

function getName(){
  return localStorage.getItem("roommatic_name") || MOCK.user.name;
}
function getEmail(){
  return localStorage.getItem("roommatic_email") || MOCK.user.email;
}
function escapeHtml(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
