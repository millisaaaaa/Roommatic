<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROOMMATIC - Hero Test</title>

  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./index-hero.css" />
</head>
<body>

  <!-- Navbar -->
  <header class="hero-test-navbar">
    <div class="hero-test-navbar-inner">
      <a href="#" class="hero-test-brand">
        <img src="../images/Logo.png" alt="Roommatic Logo" class="hero-test-brand-logo" />
        <span>ROOMMATIC</span>
      </a>

      <nav class="hero-test-nav">
        <a href="#">系統介紹</a>
        <a href="#">FAQ</a>
        <a href="#">方案</a>
      </nav>

      <a href="#" class="hero-test-login">登入</a>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero-v4">
    <div class="hero-v4-bg"></div>
    <div class="hero-v4-light-rays"></div>
    <div class="hero-v4-light-core"></div>

    <div class="hero-v4-mist hero-v4-mist-1"></div>
    <div class="hero-v4-mist hero-v4-mist-2"></div>

    <div class="hero-v4-content">
      <a href="#" class="hero-v4-side-btn hero-v4-side-btn-left">開始使用</a>

      <div class="hero-v4-visual-wrap">
        <img src="../images/Hero2.png" alt="Roommatic Hero" class="hero-v4-main-image" />

        <p class="hero-v4-subtitle">
          以輕盈、即時、溫柔的方式，幫助你看見每個空間的狀態與變化。
        </p>
      </div>

      <a href="#" class="hero-v4-side-btn hero-v4-side-btn-right">深入了解</a>
    </div>

    <div class="hero-v4-flow">
      <svg viewBox="0 0 1440 260" preserveAspectRatio="none" class="flow-svg flow-svg-back">
        <path d="M0,170 C180,130 310,220 520,175 C710,132 845,120 1030,150 C1190,175 1300,205 1440,180 L1440,260 L0,260 Z"></path>
      </svg>

      <svg viewBox="0 0 1440 260" preserveAspectRatio="none" class="flow-svg flow-svg-front">
        <path d="M0,185 C170,215 340,145 560,170 C770,192 910,128 1120,150 C1280,168 1360,200 1440,190 L1440,260 L0,260 Z"></path>
      </svg>
    </div>
  </section>

  <!-- 測試下方區塊 -->
  <section class="hero-test-next-section">
    <div class="hero-test-next-inner">
      <p class="hero-test-next-kicker">ROOMMATIC</p>
      <h2>讓空間管理更輕盈，也更即時</h2>
      <p>
        這裡先放測試內容，主要是確認 Hero 與下方區塊的銜接感，
        看起來是否比原本更自然，也更像正式首頁。
      </p>
    </div>
  </section>

</body>
</html>
